image: atlassian/default-image:3

pipelines:
  branches:
    main:
      - step:
          name: Build & Push to ECR
          services:
            - docker
          caches:
            - docker
          script:
            - docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest .
            - docker tag \
              $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest \
              $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$BITBUCKET_COMMIT
            - pipe: atlassian/aws-ecr-push-image:2.6.0
              variables:
                AWS_DEFAULT_REGION: $AWS_REGION
                AWS_ACCOUNT_ID: $AWS_ACCOUNT_ID
                IMAGE_NAME: $ECR_REPO
                TAGS: "latest,$BITBUCKET_COMMIT"

      - step:
          name: Deploy to ECS
          script:
            - pipe: atlassian/aws-ecs-deploy:1.15.0
              variables:
                AWS_DEFAULT_REGION: $AWS_REGION
                AWS_ACCOUNT_ID: $AWS_ACCOUNT_ID
                CLUSTER_NAME: $ECS_CLUSTER
                SERVICE_NAME: $API_SERVICE_NAME
                TASK_DEFINITION: $TASK_DEF_NAME_API
                FORCE_DEPLOY: "true"

            - pipe: atlassian/aws-ecs-deploy:1.15.0
              variables:
                AWS_DEFAULT_REGION: $AWS_REGION
                AWS_ACCOUNT_ID: $AWS_ACCOUNT_ID
                CLUSTER_NAME: $ECS_CLUSTER
                SERVICE_NAME: $WORKER_SERVICE_NAME
                TASK_DEFINITION: $TASK_DEF_NAME_WORKER
                FORCE_DEPLOY: "true"
