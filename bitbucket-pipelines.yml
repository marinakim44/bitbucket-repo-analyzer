image: atlassian/default-image:3

pipelines:
  branches:
    main:
      - step:
          name: Build & Push to ECR
          services:
            - docker
          caches:
            - docker
          script:
            # Build & tag image (one for API server.js and one for SQS worker.js)
            - docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest .
            - docker tag $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest \
              $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$BITBUCKET_COMMIT

            # Push to ECR
            - pipe: atlassian/aws-ecr-push-image:1.2.3
              variables:
                AWS_DEFAULT_REGION: $AWS_REGION
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                IMAGE_NAME: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO
                TAGS: "latest,$BITBUCKET_COMMIT"

      - step:
          name: Deploy to ECS
          script:
            - pipe: atlassian/aws-ecs-deploy:1.3.0
              variables:
                AWS_DEFAULT_REGION: $AWS_REGION
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                CLUSTER_NAME: $ECS_CLUSTER
                SERVICE_NAME: $API_SERVICE_NAME
                TASK_DEFINITION: support-manager-worker-taskdef
                FORCE_DEPLOY: "true"
            - pipe: atlassian/aws-ecs-deploy:1.3.0
              variables:
                AWS_DEFAULT_REGION: $AWS_REGION
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                CLUSTER_NAME: $ECS_CLUSTER
                SERVICE_NAME: $WORKER_SERVICE_NAME
                TASK_DEFINITION: support-manager-worker-taskdef
                FORCE_DEPLOY: "true"
