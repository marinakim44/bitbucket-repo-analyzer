image: atlassian/default-image:3

pipelines:
  branches:
    main:
      - step:
          name: Build & Push to ECR
          services:
            - docker
          caches:
            - docker
          script:
            - docker build -t $ECR_REPO:latest -t $ECR_REPO:$BITBUCKET_COMMIT .
            - pipe: atlassian/aws-ecr-push-image:2.6.0
              variables:
                AWS_DEFAULT_REGION: $AWS_REGION
                AWS_ACCOUNT_ID: $AWS_ACCOUNT_ID
                IMAGE_NAME: $ECR_REPO
                TAGS: "latest"

            - pipe: atlassian/aws-ecr-push-image:2.6.0
              variables:
                AWS_DEFAULT_REGION: $AWS_REGION
                AWS_ACCOUNT_ID: $AWS_ACCOUNT_ID
                IMAGE_NAME: $ECR_REPO
                TAGS: "$BITBUCKET_COMMIT"

      - step:
          name: Deploy to ECS
          services:
            - docker
          script:
            - envsubst < support-manager-task.json > task-def-updated.json
            - pipe: atlassian/aws-ecs-deploy:1.15.0
              variables:
                AWS_DEFAULT_REGION: $AWS_REGION
                AWS_ACCOUNT_ID: $AWS_ACCOUNT_ID
                CLUSTER_NAME: $ECS_CLUSTER
                SERVICE_NAME: $API_SERVICE_NAME
                TASK_DEFINITION: task-def-updated.json
                FORCE_DEPLOY: "true"

            - envsubst < support-manager-task-worker.json > task-def-worker-updated.json
            - pipe: atlassian/aws-ecs-deploy:1.15.0
              variables:
                AWS_DEFAULT_REGION: $AWS_REGION
                AWS_ACCOUNT_ID: $AWS_ACCOUNT_ID
                CLUSTER_NAME: $ECS_CLUSTER
                SERVICE_NAME: $WORKER_SERVICE_NAME
                TASK_DEFINITION: task-def-worker-updated.json
                FORCE_DEPLOY: "true"
